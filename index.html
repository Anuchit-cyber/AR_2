<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>DME WebAR Open House</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <a-scene mindar-image="imageTargetSrc: targets.mind;" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: true">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">

            <a-image src="DME_Poster.jpg" position="0 -0.2 0" scale="1 1 1">
            </a-image>

            <a-text value="DME AR Open House" position="0 0.45 0" align="center" scale="1.2 1.2 1.2" color="white">
            </a-text>

            <a-entity text-geometry="value: DME AR OPEN HOUSE; size: 0.15; height: 0.05" material="color: #ffffff"
                position="-0.8 0.2 0" rotation="0 0 0">
            </a-entity>

        </a-entity>

    </a-scene>
</body>

</html>
